# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration Smithery collects from users
    # before starting the server, and prompts them for on the server page.
    type: object
    required:
      - icountApiToken
    properties:
      icountApiToken:
        type: string
        description: >-
          Your iCount API token. Generate one from your iCount account under
          Settings -> API, then paste it here.
      icountTimeoutMs:
        type: integer
        description: Request timeout in milliseconds (optional, default 30000).
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['src/index.js'],
      env: {
        ICOUNT_API_TOKEN: config.icountApiToken,
        ...(config.icountTimeoutMs ? { ICOUNT_TIMEOUT_MS: String(config.icountTimeoutMs) } : {})
      }
    })
