name: Release

# Cutting a tag is what publishes. The tarball that gets attested is the exact
# one uploaded to the release and pushed to npm — built once, here, so the
# Sigstore provenance actually describes the artifact people install.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # Sigstore signing + npm provenance
      attestations: write # record the attestation on the repo

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test

      - name: tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: build tarball
        id: pack
        run: |
          npm pack --json > pack.json
          file="$(node -p "require('./pack.json')[0].filename")"
          test -f "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.pack.outputs.file }}

      # Idempotent: a re-run for an already-released tag must not fail here,
      # or the npm publish step below becomes unreachable.
      - name: create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pack.outputs.file }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists - replacing its asset"
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$ASSET"
          fi

      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set — skipping npm publish (GitHub release still created)."
            exit 0
          fi
          npm publish "${{ steps.pack.outputs.file }}" --provenance --access public
